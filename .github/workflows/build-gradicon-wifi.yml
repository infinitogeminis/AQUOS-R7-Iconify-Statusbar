name: Build Gradicon Wi-Fi Vector module

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Vector module APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK metadata and bundled Gradicon resources
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'META-INF/xposed/module.prop'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -q 'targetApiVersion=102'
          unzip -p "$APK" META-INF/xposed/scope.list | grep -q 'com.android.systemui'
          for level in 1 2 3 4; do
            unzip -l "$APK" | grep -q "gradicon_wifi_${level}."
          done
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload Vector APK
        uses: actions/upload-artifact@v4
        with:
          name: AQUOS-R7-Gradicon-WiFi-Vector-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
