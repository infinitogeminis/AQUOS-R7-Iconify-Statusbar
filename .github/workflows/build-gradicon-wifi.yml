name: Build Gradicon Wi-Fi + Cellular Vector module

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: gradicon-vector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify source targets SignalDrawable level updates
        shell: bash
        run: |
          set -euo pipefail
          SRC="app/src/main/java/org/aquosr7/gradicon/Entry.java"
          grep -Fq 'Drawable.class.getDeclaredMethod("setLevel", int.class)' "$SRC"
          grep -Fq 'setImageDrawable' "$SRC"
          grep -Fq 'SignalDrawable' "$SRC"
          grep -Fq 'mobile_signal' "$SRC"
          grep -Fq 'getCellularReplacement' "$SRC"
          ! grep -Fq 'CELLULAR_VIEW_ID.equals(view)' "$SRC"
          grep -Fq "versionName '0.3.1'" app/build.gradle
      - name: Build Vector module APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK metadata, hook code and bundled resources
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -p "$APK" META-INF/xposed/module.prop | grep -q 'targetApiVersion=102'
          unzip -p "$APK" META-INF/xposed/scope.list | grep -qx 'com.android.systemui'
          unzip -p "$APK" META-INF/xposed/java_init.list | grep -qx 'org.aquosr7.gradicon.Entry'
          for level in 1 2 3 4; do
            unzip -l "$APK" | grep -q "gradicon_wifi_${level}."
            unzip -l "$APK" | grep -q "gradicon_cellular_${level}_4_bar."
          done
          for marker in 'aquosr7-gradicon-cellular-level' 'SignalDrawable' 'Applied Gradicon cellular bars='; do
            found=0
            while IFS= read -r dex; do
              if unzip -p "$APK" "$dex" | strings | grep -Fq "$marker"; then found=1; break; fi
            done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\\.dex
          aapt dump badging "$APK" | grep -q "versionName='0.3.1'"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload Vector APK
        uses: actions/upload-artifact@v4
        with:
          name: AQUOS-R7-Gradicon-WiFi-Cellular-Vector-v0.3.1
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
)
            test "$found" -eq 1
          done
          aapt dump badging "$APK" | grep -q "versionName='0.3.1'"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload Vector APK
        uses: actions/upload-artifact@v4
        with:
          name: AQUOS-R7-Gradicon-WiFi-Cellular-Vector-v0.3.1
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
